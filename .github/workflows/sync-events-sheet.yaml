name: Sincronizar Eventos desde Google Sheets

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: 'ID del Google Sheet (deja vacío para usar el Secret SPREADSHEET_ID)'
        required: false
        type: string
      sheet_name:
        description: 'Nombre de la pestaña del Sheet (por defecto: Eventos)'
        required: false
        type: string
        default: Eventos
      dry_run:
        description: 'Modo simulación: lee el Sheet pero no crea Issues ni marca filas como procesadas'
        required: false
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync events from Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id || secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ inputs.sheet_name || 'Eventos' }}
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/sync-events-sheet.js
